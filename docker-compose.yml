services:
  api:
    image: transcodex-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    ports:
      - "${TRANSCODEX_API_PORT:-8080}:8080"

  worker:
    image: transcodex-worker:local
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully

  reaper:
    image: transcodex-reaper:local
    build:
      context: .
      dockerfile: reaper/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  demo:
    build:
      context: .
      dockerfile: frontend/demo/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:80"

  dashboard:
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "3001:80"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
      reaper:
        condition: service_started

  migrate:
    image: migrate/migrate:4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/transcodex?sslmode=disable",
        "up"
      ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transcodex
    ports:
      - "${TRANSCODEX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transcodex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${TRANSCODEX_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: transcodex
      MINIO_ROOT_PASSWORD: transcodex-secret
    ports:
      - "${TRANSCODEX_MINIO_PORT:-9000}:9000"
      - "${TRANSCODEX_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set transcodex http://minio:9000 transcodex transcodex-secret; do
          sleep 2
        done
        mc mb --ignore-existing transcodex/transcodex
        mc anonymous set download transcodex/transcodex/outputs

volumes:
  postgres_data:
  minio_data:
